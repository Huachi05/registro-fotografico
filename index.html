<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>Registro Fotográfico Operacional</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#14312f;background:#edf3f1}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;margin:auto;padding:18px 14px 70px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #14312f12}.hidden{display:none!important}h1{font-size:1.55rem;margin:2px 0}.eyebrow{font-size:.72rem;font-weight:850;letter-spacing:.13em;color:#0f766e;margin:0}.field{display:grid;gap:7px;margin-bottom:14px}label{font-weight:750}input,select,textarea{width:100%;font:inherit;border:1px solid #b7c8c4;border-radius:12px;padding:13px;background:#fff}textarea{min-height:88px;resize:vertical}.camera{display:block;text-align:center;background:#164e5a;color:#fff;border-radius:14px;padding:16px;margin-bottom:13px;cursor:pointer}.camera input{display:none}.previews{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}.photo-card{position:relative;background:#dce7e4;border-radius:14px;overflow:hidden;min-height:130px}.photo-card img{width:100%;height:180px;object-fit:cover;display:block}.remove{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:32px;height:32px;background:#991b1b;color:#fff;font-weight:900}.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:850}.primary{background:#0f766e;color:#fff}.btn:disabled{opacity:.5}.message{border-radius:11px;padding:11px;margin:10px 0;background:#ecfdf5;color:#166534}.message.error{background:#fef2f2;color:#991b1b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.link{border:0;background:transparent;color:#0f766e;font-weight:800}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#f2f7f5;border-radius:12px;padding:10px 4px;font-size:.78rem}.stat b{font-size:1.2rem;display:block}.item{padding:9px 0;border-bottom:1px solid #e5ecea;display:flex;justify-content:space-between;font-size:.85rem}.online{color:#15803d}.offline{color:#b45309}.muted{color:#617571;font-size:.87rem}.login{margin-top:9vh}.progress{height:6px;background:#dfe8e5;border-radius:99px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:#0f766e;width:45%;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media(max-width:420px){.previews{grid-template-columns:1fr}.photo-card img{height:220px}}
</style>
</head>
<body><main class="app">
<section id="startup" class="card login"><p class="eyebrow">REGISTRO FOTOGRÁFICO</p><h1>Iniciando aplicación</h1><p id="startupText" class="muted">Cargando…</p></section>
<section id="login" class="card login hidden"><p class="eyebrow">REGISTRO FOTOGRÁFICO</p><h1>Ingresar</h1><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><p id="loginError" class="message error hidden"></p><button class="btn primary">Ingresar</button></form></section>
<div id="main" class="hidden">
<header class="row"><div><p class="eyebrow">OPERACIONES</p><h1>Registro fotográfico</h1></div><button id="logout" class="link">Salir</button></header>
<form id="form" class="card">
<div class="field"><label>Fecha</label><input id="recordDate" type="date" required></div>
<div class="field"><label>Servicio</label><select id="service" required><option value="">Seleccionar servicio</option><option>Reenzunchado</option><option>Cambio de taco</option><option>Cambio de interventor</option></select></div>
<div class="field"><label>m3</label><input id="m3" type="number" inputmode="decimal" min="0.001" step="0.001" required></div>
<label class="camera">📷 Adjuntar 2 fotografías<input id="photos" type="file" accept="image/*" capture="environment" multiple></label>
<p class="muted">Debe adjuntar exactamente 2 fotografías.</p><div id="previews" class="previews"></div>
<div class="field"><label>Observación opcional</label><textarea id="observation" maxlength="2000"></textarea></div>
<p id="message" class="message hidden"></p><button id="save" class="btn primary" disabled>Guardar y sincronizar</button><div id="working" class="progress hidden"><span></span></div>
</form>
<section class="card"><div class="row"><h2>Estado</h2><strong id="connection" class="online">● Online</strong></div><div class="status"><div class="stat"><b id="sent">0</b>Enviados</div><div class="stat"><b id="pending">0</b>Pendientes</div><div class="stat"><b id="errors">0</b>Error</div></div><div id="queue"></div></section>
</div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.76.1';
const SUPABASE_URL='https://akgdwzotziybpfxxxsjc.supabase.co';
const SUPABASE_PUBLIC_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrZ2R3em90eml5YnBmeHh4c2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODk3MzAsImV4cCI6MjEwODA2NTczMH0.rXZXVdJ2oiV5Rbbjxb3NwNZgusU1ghmLh8ACkZoJtww';
const $=id=>document.getElementById(id);let sb,user,selected=[],saving=false,syncing=false;const DB='rfo-two-photos-v1',STORE='records';
function show(id){['startup','login','main'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function today(){const d=new Date(),o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)}
function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'uuid'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(v){const d=await openDb();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function all(){const d=await openDb();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function blob(canvas,q){return new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('No se pudo procesar la imagen')),'image/jpeg',q))}async function resize(file,max,q){const i=await createImageBitmap(file,{imageOrientation:'from-image'}),s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d',{alpha:false}).drawImage(i,0,0,c.width,c.height);i.close();return blob(c,q)}async function prep(f){const photo=await resize(f,1600,.7),thumb=await resize(f,400,.62),h=await crypto.subtle.digest('SHA-256',await photo.arrayBuffer());return{photo,thumb,size:photo.size,thumbSize:thumb.size,checksum:[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}}
function path(r,n,thumb=false){const[y,m,d]=r.captureTimestamp.slice(0,10).split('-');return`records/${y}/${m}/${d}/${r.uuid}/${thumb?'thumbnail_'+n:'photo_'+n}.jpg`}async function uploadOne(r,n){const p=r['photo'+n],t=r['thumb'+n],pp=path(r,n),tp=path(r,n,true);let x=await sb.storage.from('operational-photos').upload(pp,p,{contentType:'image/jpeg',upsert:false});if(x.error&&!x.error.message.toLowerCase().includes('exist'))throw x.error;x=await sb.storage.from('operational-photos').upload(tp,t,{contentType:'image/jpeg',upsert:false});if(x.error&&!x.error.message.toLowerCase().includes('exist'))throw x.error;return{pp,tp}}
async function process(r){if(!navigator.onLine||r.state==='CLOUD_READY')return;r.state='UPLOADING';await put(r);try{let{error}=await sb.rpc('create_package_record',{p_uuid:r.uuid,p_visible_id:r.visibleId,p_m3:r.m3,p_record_date:r.recordDate,p_service:r.service,p_observation:r.observation,p_capture_timestamp:r.captureTimestamp,p_client_created_at:r.clientCreatedAt,p_filename:`${r.visibleId}.jpg`,p_device_id:r.deviceId});if(error)throw error;const a=await uploadOne(r,1),b=await uploadOne(r,2);({error}=await sb.rpc('finalize_two_photo_upload',{p_uuid:r.uuid,p_photo_1_path:a.pp,p_thumbnail_1_path:a.tp,p_photo_1_size:r.photo1Size,p_photo_1_checksum:r.photo1Checksum,p_photo_2_path:b.pp,p_thumbnail_2_path:b.tp,p_photo_2_size:r.photo2Size,p_photo_2_checksum:r.photo2Checksum}));if(error)throw error;r.state='CLOUD_READY';r.lastError=''}catch(e){r.state='RETRY_WAIT';r.lastError=String(e.message||e)}await put(r)}
async function sync(){if(syncing||!navigator.onLine)return;syncing=true;try{for(const r of await all())if(r.state!=='CLOUD_READY')await process(r);await refresh()}finally{syncing=false}}async function refresh(){const rows=await all();$('sent').textContent=rows.filter(x=>x.state==='CLOUD_READY').length;$('pending').textContent=rows.filter(x=>x.state!=='CLOUD_READY').length;$('errors').textContent=rows.filter(x=>x.state==='RETRY_WAIT').length;$('connection').textContent=navigator.onLine?'● Online':'● Sin conexión';$('connection').className=navigator.onLine?'online':'offline';$('queue').innerHTML=rows.slice(-10).reverse().map(r=>`<div class="item"><b>${r.visibleId}</b><span>${r.state}</span></div>`).join('')}
function render(){const box=$('previews');box.innerHTML='';selected.forEach((f,i)=>{const u=URL.createObjectURL(f),d=document.createElement('div');d.className='photo-card';d.innerHTML=`<img src="${u}" alt="Fotografía ${i+1}"><button type="button" class="remove">×</button>`;d.querySelector('button').onclick=()=>{selected.splice(i,1);render()};box.appendChild(d)});$('save').disabled=selected.length!==2}
$('photos').onchange=e=>{const incoming=[...e.target.files];for(const f of incoming)if(selected.length<2)selected.push(f);e.target.value='';render()};$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent='No fue posible iniciar sesión';$('loginError').classList.remove('hidden')}else location.reload()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('form').onsubmit=async e=>{e.preventDefault();if(saving||selected.length!==2)return;saving=true;$('save').disabled=true;$('working').classList.remove('hidden');try{const now=new Date(),id=crypto.randomUUID(),a=await prep(selected[0]),b=await prep(selected[1]),m3=Number($('m3').value);const r={uuid:id,visibleId:`RF-${now.toISOString().slice(0,10).replaceAll('-','')}-${id.replaceAll('-','').slice(0,6).toUpperCase()}`,m3,recordDate:$('recordDate').value,service:$('service').value,observation:$('observation').value.trim(),captureTimestamp:now.toISOString(),clientCreatedAt:now.toISOString(),deviceId:localStorage.rfoDevice||(localStorage.rfoDevice=crypto.randomUUID()),photo1:a.photo,thumb1:a.thumb,photo1Size:a.size,photo1Checksum:a.checksum,photo2:b.photo,thumb2:b.thumb,photo2Size:b.size,photo2Checksum:b.checksum,state:'PENDING_UPLOAD',createdAt:Date.now()};await put(r);selected=[];render();$('m3').value='';$('service').value='';$('observation').value='';$('message').textContent=navigator.onLine?'Guardado. Sincronización automática iniciada.':'Guardado localmente. Se sincronizará al volver Internet.';$('message').className='message';void sync()}catch(e){$('message').textContent=String(e.message||e);$('message').className='message error'}finally{saving=false;$('working').classList.add('hidden');$('save').disabled=selected.length!==2}};
async function boot(){if(SUPABASE_URL.startsWith('REEMPLAZAR_'))throw new Error('Falta configurar Supabase en index.html');sb=createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const{data}=await sb.auth.getSession();if(!data.session){show('login');return}user=data.session.user;$('recordDate').value=today();show('main');await refresh();void sync()}addEventListener('online',sync);setInterval(sync,15000);boot().catch(e=>{$('startupText').textContent=String(e.message||e)});
</script></body></html>
